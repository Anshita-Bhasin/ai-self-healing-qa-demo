<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Portal Demo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page">
      <section class="login-panel" aria-label="QA portal login">
        <p class="eyebrow">AB Automation Hub</p>
        <h1>QA Portal</h1>
        <p class="copy">A small app for demonstrating AI-assisted self-healing tests.</p>

        <form id="loginForm">
          <label>
            Email
            <input data-testid="email-input" name="email" type="email" value="anshita@example.com">
          </label>

          <label>
            Password
            <input data-testid="password-input" name="password" type="password" value="demo1234">
          </label>

          <button class="primary-action" data-testid="sign-in-button" type="submit">
            Sign in
          </button>
        </form>

        <p class="message" data-testid="login-message" role="status"></p>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
